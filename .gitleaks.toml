[extend]
useDefault = true

[[rules]]
id = "decision-assurance-provider-secret-file"
description = "Provider credentials must never be committed from .secrets"
regex = '''(?s).+'''
path = '''(?i)\.secrets[\\/](OPENAI_API_KEY|FIRECRAWL_API_KEY|keycloak-admin-username|keycloak-admin-password|keycloak-db-password|pilot-tls-evidence|pilot-recovery-evidence)$'''
tags = ["key", "provider", "secret-file"]
