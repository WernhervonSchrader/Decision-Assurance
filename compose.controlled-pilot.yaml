name: decision-assurance-controlled-pilot

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: decision_assurance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-bootstrap-password
    secrets: [postgres-bootstrap-password]
    volumes:
      - pilot-postgres-data:/var/lib/postgresql/data
      - ./migrations/postgresql/roles.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d decision_assurance"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pilot-internal]
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        DA_VERSION: "0.5.0"
        DA_COMMIT_SHA: ${DA_COMMIT_SHA:?DA_COMMIT_SHA is required}
        DA_BUILD_TIMESTAMP: ${DA_BUILD_TIMESTAMP:?DA_BUILD_TIMESTAMP is required}
    command: ["decision-assurance-migrate"]
    entrypoint: []
    environment:
      DA_SECRET_DIRECTORY: /run/secrets
      DA_DATABASE_DSN_SECRET_REF: database-dsn-migration
      DA_DATABASE_ROLE: decision_assurance_migration
    secrets: [database-dsn-migration]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    networks: [pilot-internal]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        DA_VERSION: "0.5.0"
        DA_COMMIT_SHA: ${DA_COMMIT_SHA:?DA_COMMIT_SHA is required}
        DA_BUILD_TIMESTAMP: ${DA_BUILD_TIMESTAMP:?DA_BUILD_TIMESTAMP is required}
    environment:
      DA_CONFIG_PATH: /app/config/deployment/controlled-pilot.example.json
      DA_SECRET_DIRECTORY: /run/secrets
      DA_POLICIES_PATH: /app/config/pilot/intake-policies.example.json
      DA_DATABASE_ROLE: decision_assurance_application
      DA_HOST: 0.0.0.0
      DA_PORT: "8000"
      OPENAI_BASE_URL: https://api.openai.com
      FIRECRAWL_BASE_URL: https://api.firecrawl.dev
    secrets:
      - source: database-dsn
        target: decision-assurance-database-dsn
      - source: openai-api-key
        target: OPENAI_API_KEY
      - source: firecrawl-api-key
        target: FIRECRAWL_API_KEY
      - source: lifecycle-pepper
        target: pilot-lifecycle-pepper
      - source: export-signing-key
        target: pilot-export-signing-key
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    networks: [pilot-internal]
    security_opt: ["no-new-privileges:true"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        DA_VERSION: "0.5.0"
        DA_COMMIT_SHA: ${DA_COMMIT_SHA:?DA_COMMIT_SHA is required}
        DA_BUILD_TIMESTAMP: ${DA_BUILD_TIMESTAMP:?DA_BUILD_TIMESTAMP is required}
    environment:
      DA_CONFIG_PATH: /app/config/deployment/controlled-pilot.example.json
      DA_SECRET_DIRECTORY: /run/secrets
      DA_DATABASE_ROLE: decision_assurance_worker
      DA_WORKER_ID: pilot-worker-1
      OPENAI_BASE_URL: https://api.openai.com
      FIRECRAWL_BASE_URL: https://api.firecrawl.dev
    secrets:
      - source: database-dsn
        target: decision-assurance-database-dsn
      - source: worker-database-dsn
        target: decision-assurance-worker-database-dsn
      - source: openai-api-key
        target: OPENAI_API_KEY
      - source: firecrawl-api-key
        target: FIRECRAWL_API_KEY
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    networks: [pilot-internal]
    security_opt: ["no-new-privileges:true"]

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        DA_VERSION: "0.5.0"
        DA_COMMIT_SHA: ${DA_COMMIT_SHA:?DA_COMMIT_SHA is required}
        DA_BUILD_TIMESTAMP: ${DA_BUILD_TIMESTAMP:?DA_BUILD_TIMESTAMP is required}
    environment:
      DA_CONFIG_PATH: /app/config/deployment/controlled-pilot.example.json
      DA_SECRET_DIRECTORY: /run/secrets
      DA_DATABASE_ROLE: decision_assurance_application
      DA_MCP_HOST: 0.0.0.0
      DA_MCP_PORT: "8001"
      DA_MCP_ISSUER_URL: https://identity.pilot.example/realms/decision-assurance
      DA_MCP_RESOURCE_SERVER_URL: https://research.pilot.example/mcp
      DA_MCP_ALLOWED_HOSTS: research.pilot.example
    secrets:
      - source: database-dsn
        target: decision-assurance-database-dsn
      - source: openai-api-key
        target: OPENAI_API_KEY
      - source: firecrawl-api-key
        target: FIRECRAWL_API_KEY
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    networks: [pilot-internal]
    security_opt: ["no-new-privileges:true"]

  keycloak-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak-db-password
    secrets: [keycloak-db-password]
    volumes: ["pilot-keycloak-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pilot-internal]
    security_opt: ["no-new-privileges:true"]

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    user: "1000:0"
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak # gitleaks:allow; host only
      KC_DB_USERNAME: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://identity.pilot.example
      KC_HOSTNAME_STRICT: "true"
    secrets: [keycloak-db-password]
    volumes:
      - ./integrations/keycloak/decision-assurance-realm.json:/opt/keycloak/data/import/decision-assurance-realm.json:ro
    depends_on:
      keycloak-postgres: {condition: service_healthy}
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /opt/keycloak/data/tmp:size=64m,noexec,nosuid
    networks: [pilot-internal]
    security_opt: ["no-new-privileges:true"]

  keycloak-bootstrap:
    profiles: ["bootstrap"]
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    user: "1000:0"
    entrypoint: ["/opt/keycloak/bin/decision-assurance-bootstrap-entrypoint.sh"]
    command: ["bootstrap-admin", "user", "--optimized", "--username:env", "DA_KEYCLOAK_BOOTSTRAP_USERNAME", "--password:env", "DA_KEYCLOAK_BOOTSTRAP_PASSWORD", "--no-prompt"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak # gitleaks:allow; host only
      KC_DB_USERNAME: keycloak
    secrets: [keycloak-admin-username, keycloak-admin-password, keycloak-db-password]
    depends_on:
      keycloak-postgres: {condition: service_healthy}
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /opt/keycloak/data/tmp:size=64m,noexec,nosuid
    networks: [pilot-internal]
    security_opt: ["no-new-privileges:true"]
    logging: {driver: none}

  pilot-ui:
    build:
      context: .
      dockerfile: Dockerfile.pilot-ui
      args:
        DA_VERSION: "0.5.0"
        DA_COMMIT_SHA: ${DA_COMMIT_SHA:?DA_COMMIT_SHA is required}
        DA_BUILD_TIMESTAMP: ${DA_BUILD_TIMESTAMP:?DA_BUILD_TIMESTAMP is required}
    environment:
      DA_CONFIG_PATH: /app/config/deployment/controlled-pilot.example.json
      DA_SECRET_DIRECTORY: /run/secrets
      DA_INTERNAL_API_URL: http://api:8000
      DA_PILOT_UI_HOST: 0.0.0.0
      DA_PILOT_UI_PORT: "8080"
    secrets:
      - source: database-dsn
        target: decision-assurance-database-dsn
      - source: session-pepper
        target: pilot-session-pepper
      - source: session-envelope-key
        target: pilot-session-envelope-key
    depends_on:
      api: {condition: service_started}
      keycloak: {condition: service_started}
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    networks: [pilot-internal]
    security_opt: ["no-new-privileges:true"]

  edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
    environment:
      DA_PUBLIC_HOST: research.pilot.example
      DA_IDENTITY_HOST: identity.pilot.example
    secrets: [pilot-tls-cert, pilot-tls-key]
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      pilot-ui: {condition: service_started}
      mcp: {condition: service_started}
      keycloak: {condition: service_started}
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
      - /config:size=16m,noexec,nosuid
      - /data:size=16m,noexec,nosuid
    networks: [pilot-internal]
    security_opt: ["no-new-privileges:true"]

networks:
  pilot-internal:
    ipam:
      config: [{subnet: 172.30.0.0/24}]

volumes:
  pilot-postgres-data:
  pilot-keycloak-data:

secrets:
  postgres-bootstrap-password: {file: ./.secrets/postgres-bootstrap-password}
  database-dsn-migration: {file: ./.secrets/database-dsn-migration}
  database-dsn: {file: ./.secrets/decision-assurance-database-dsn}
  worker-database-dsn: {file: ./.secrets/decision-assurance-worker-database-dsn}
  openai-api-key: {file: ./.secrets/OPENAI_API_KEY}
  firecrawl-api-key: {file: ./.secrets/FIRECRAWL_API_KEY}
  lifecycle-pepper: {file: ./.secrets/pilot-lifecycle-pepper}
  session-pepper: {file: ./.secrets/pilot-session-pepper}
  session-envelope-key: {file: ./.secrets/pilot-session-envelope-key}
  export-signing-key: {file: ./.secrets/pilot-export-signing-key}
  keycloak-admin-username: {file: ./.secrets/keycloak-admin-username}
  keycloak-admin-password: {file: ./.secrets/keycloak-admin-password}
  keycloak-db-password: {file: ./.secrets/keycloak-db-password}
  pilot-tls-cert: {file: ./.secrets/pilot-tls-cert}
  pilot-tls-key: {file: ./.secrets/pilot-tls-key}
