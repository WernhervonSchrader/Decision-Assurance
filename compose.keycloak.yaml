name: decision-assurance-keycloak-local

services:
  keycloak-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak-db-password
    secrets:
      - keycloak-db-password
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    user: "1000:0"
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HOSTNAME_STRICT: "true"
    secrets:
      - keycloak-db-password
    volumes:
      - ./integrations/keycloak/decision-assurance-realm.json:/opt/keycloak/data/import/decision-assurance-realm.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&3;
          grep -q 'HTTP/1.0 200' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /opt/keycloak/data/tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  keycloak-bootstrap:
    profiles: ["bootstrap"]
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    user: "1000:0"
    entrypoint: ["/opt/keycloak/bin/decision-assurance-bootstrap-entrypoint.sh"]
    command:
      - bootstrap-admin
      - user
      - --optimized
      - --username:env
      - DA_KEYCLOAK_BOOTSTRAP_USERNAME
      - --password:env
      - DA_KEYCLOAK_BOOTSTRAP_PASSWORD
      - --no-prompt
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak #gitleaks:allow
      KC_DB_USERNAME: keycloak
    secrets:
      - keycloak-admin-username
      - keycloak-admin-password
      - keycloak-db-password
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /opt/keycloak/data/tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  keycloak-postgres-data:

secrets:
  keycloak-admin-username:
    file: ./.secrets/keycloak-admin-username
  keycloak-admin-password:
    file: ./.secrets/keycloak-admin-password
  keycloak-db-password:
    file: ./.secrets/keycloak-db-password
