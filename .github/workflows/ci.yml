name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src
      - run: python -m pytest -q -m "not postgresql"
      - run: decision-assurance benchmark tests/gold/manifest.json
      - run: python -m pytest tests/intake/benchmark -q
      - run: bandit -q -r src -s B105
      - run: pip-audit
      - run: python -m build
      - run: decision-assurance-openapi /tmp/openapi-v0.4.json && diff -u docs/openapi-v0.4.json /tmp/openapi-v0.4.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-artifacts
          path: |
            docs/openapi-v0.4.json
            benchmarks/intake
            .pytest_cache

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: decision_assurance
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d decision_assurance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/decision_assurance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/production/postgresql -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
