[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-assurance-engine"
version = "0.5.0"
description = "Deterministic reference engine for the Decision Assurance Specification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "click>=8.3.3,<9",
  "cryptography>=48.0.1,<50",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "idna>=3.15,<4",
  "jsonschema>=4.20,<5",
  "mcp>=1.29,<2",
  "pydantic>=2.13,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<3",
  "pytest>=8,<10",
  "pyyaml>=6,<7",
  "ruff>=0.11,<1",
  "trio>=0.30,<1",
]

[project.scripts]
decision-assurance = "decision_assurance.cli:main"
decision-assurance-api = "decision_assurance.api.runtime:main"
decision-assurance-openapi = "decision_assurance.api.openapi:main"
decision-assurance-worker = "decision_assurance.api.worker_runtime:main"
decision-assurance-migrate = "decision_assurance.persistence.migrate:main"
decision-assurance-mcp = "decision_assurance.mcp.runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_assurance"]

[tool.hatch.build]
include = [
  "src/decision_assurance/**/*.py",
  "src/decision_assurance/migrations/**/*.sql",
  "src/decision_assurance/schemas/**/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "postgresql: requires a live PostgreSQL service",
  "keycloak_e2e: requires the isolated local Keycloak Compose stack",
  "live_provider: requires explicit opt-in and local provider credentials",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"src/decision_assurance/models.py" = ["S105"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["decision_assurance"]

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true
