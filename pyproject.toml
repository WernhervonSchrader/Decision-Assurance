[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-assurance-engine"
version = "0.2.0"
description = "Deterministic reference engine for the Decision Assurance Specification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.20,<5",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<3",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
decision-assurance = "decision_assurance.cli:main"
decision-assurance-api = "decision_assurance.api.runtime:main"
decision-assurance-openapi = "decision_assurance.api.openapi:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_assurance"]

[tool.hatch.build]
include = [
  "src/decision_assurance/**/*.py",
  "src/decision_assurance/migrations/*.sql",
  "src/decision_assurance/schemas/**/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"src/decision_assurance/models.py" = ["S105"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["decision_assurance"]

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true
